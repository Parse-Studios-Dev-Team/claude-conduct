# Weekly dependency updates, as PRs into `dev` (the integration branch), not `main`.
#
# A bump to esbuild changes the plugin's built files, so its PR fails the
# "committed build is stale" test until someone runs `npm run build` on the
# branch and pushes. That's deliberate: a new bundler changes what ships.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
